<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azkark - برنامج الأذكار</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f4f9f6;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: right;
        }
        h1 {
            text-align: center;
            color: #2c7a51;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .filter-btn {
            background-color: #e2f0ea;
            color: #2c7a51;
            border: 1px solid #2c7a51;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #2c7a51;
            color: white;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: right;
        }
        .category-tag {
            font-size: 12px;
            color: #2c7a51;
            background-color: #e2f0ea;
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .text {
            font-size: 17px;
            margin-bottom: 15px;
            line-height: 1.6;
            color: #222;
        }
        .btn-group {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
        }
        button.action-btn {
            background-color: #2c7a51;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        button.action-btn:hover {
            background-color: #235f3f;
        }
        .reset-btn {
            background-color: #e06d6d;
        }
        .reset-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Azkark</h1>
        <div class="subtitle">تطبيق الأذكار والأدعية اليومية (بلا حدود)</div>
        
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCategory('الكل', this)">الكل</button>
            {% for cat in categories %}
            <button class="filter-btn" onclick="filterCategory('{{ cat }}', this)">{{ cat }}</button>
            {% endfor %}
        </div>

        <div id="azkar-list">
            {% for zikr in azkar %}
            <div class="card azkar-item" data-category="{{ zikr.category }}">
                <div class="category-tag">{{ zikr.category }}</div>
                <div class="text">{{ zikr.text }}</div>
                <div class="btn-group">
                    <!-- نظام عداد بلا نهاية مع إظهار العدد الحالي -->
                    <button id="btn-{{ zikr.id }}" class="action-btn" onclick="incrementCounter({{ zikr.id }})">
                        العد: <span id="count-{{ zikr.id }}">0</span> مرة
                    </button>
                    <button class="action-btn reset-btn" onclick="resetCounter({{ zikr.id }})">إعادة</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        const counters = {};

        function incrementCounter(id) {
            if (!counters[id]) {
                counters[id] = 0;
            }
            
            // عدّاد بلا نهاية (يزيد باستمرار دون توقف)
            counters[id]++;
            document.getElementById(`count-${id}`).innerText = counters[id];
        }

        function resetCounter(id) {
            counters[id] = 0;
            document.getElementById(`count-${id}`).innerText = 0;
        }

        function filterCategory(category, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const items = document.querySelectorAll('.azkar-item');
            items.forEach(item => {
                if (category === 'الكل' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
